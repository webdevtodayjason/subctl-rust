[package]
name = "evy-comms"
description = "Evy v4 multi-channel router: HTTP/SSE, TUI, Discord, Telegram."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace primitives. evy-comms reads (does not mutate) the other
# crates' public surface to serve workers, jobs, and policy state over
# HTTP/SSE for the operator console.
evy-core = { workspace = true }
evy-policy = { workspace = true }
evy-providers = { workspace = true }
evy-scheduler = { workspace = true }

# Async runtime + cancellation token for graceful shutdown.
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# HTTP layer (axum 0.8 / tower 0.5 / tower-http 0.6).
axum = { workspace = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
http = "1"

# Serialization + time + ids.
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
uuid = { workspace = true }

# Streams used inside SSE handlers.
futures = "0.3"

# Errors + logging.
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

# ── Slice 2B2: Telegram bridge ───────────────────────────────────────────
# Bot API is just HTTPS+JSON; reqwest keeps the dep surface minimal vs.
# pulling a full Telegram crate. rustls-tls avoids the OpenSSL footgun.
# `stream` feature serves the SSE integration tests as well.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
url = "2"

# ── Phase 3 Slice B: Discord bridge ──────────────────────────────────────
# Discord requires a stateful gateway (WebSocket) connection for inbound
# events plus a REST surface for outbound messages + slash-command
# registration. Rolling either by hand is ~500 lines we'd own forever;
# `serenity` is the established library and matches the v3 master-bot
# stack. rustls-only — no OpenSSL footgun, same as Telegram.
#
# We disable defaults and re-add only what the bridge needs (client +
# gateway for the WS loop, model for typed Discord shapes, cache so
# EventHandler callbacks see consistent state, rustls_backend for TLS).
# `builder` and `http` ride in transitively via `client`.
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "cache",
    "rustls_backend",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
eventsource-stream = "0.2"
futures-util = "0.3"
# Mock the Telegram HTTPS endpoint at the `reqwest` boundary so tests
# never touch the real Bot API.
wiremock = "0.6"
