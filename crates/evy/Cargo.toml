[package]
name = "evy"
description = "Evy v4 daemon binary. Boots tokio, loads config, serves /health, wires the six library crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "evy"
path = "src/lib.rs"

[[bin]]
name = "evy"
path = "src/main.rs"

[dependencies]
# Library primitives. Phase 1 wires evy-core / evy-policy / evy-providers /
# evy-scheduler end-to-end; evy-comms and evy-memory remain declared but
# unconsumed pending Phase 2 (see TODO markers in src/lib.rs).
evy-core = { workspace = true }
evy-policy = { workspace = true }
evy-providers = { workspace = true }
evy-scheduler = { workspace = true }
evy-comms = { workspace = true }
evy-memory = { workspace = true }

# Runtime + observability
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Errors + config
anyhow = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }

# Cron-aware timestamps for log lines + future "next fire" diagnostics.
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
