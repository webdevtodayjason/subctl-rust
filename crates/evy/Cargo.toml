[package]
name = "evy"
description = "Evy v4 daemon binary. Boots tokio, loads config, serves /health, wires the six library crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "evy"
path = "src/lib.rs"

[[bin]]
name = "evy"
path = "src/main.rs"

[dependencies]
# Library primitives. Phase 3 Slice E wires the full stack — every
# library crate is now composed inside `run_daemon`.
evy-core = { workspace = true }
evy-policy = { workspace = true }
evy-providers = { workspace = true }
evy-scheduler = { workspace = true }
evy-comms = { workspace = true }
evy-memory = { workspace = true }
# Phase 6 — chat surface. The daemon optionally constructs a
# ThinkingPartner and hands it to evy-comms via DaemonAppState.
evy-thinking = { workspace = true }
evy-skills = { workspace = true }

# Runtime + observability
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Errors + config
anyhow = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# jobs.toml operator cron-job file (boot-time sync).
toml = { workspace = true }
clap = { workspace = true }

# DaemonAppState implements the evy-comms AppState trait — async-trait
# is needed for the impl.
async-trait = { workspace = true }

# Cron-aware timestamps for log lines + future "next fire" diagnostics.
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# ── Phase 2 Slice 2D — cutover testing ───────────────────────────────────
# These dev-deps power the `tests/cutover/` harness. Each version pin
# mirrors the choice already made in the consuming crate (evy-comms for
# the HTTP / SSE / wiremock stack) so the dep graph stays tight.
tempfile = "3"
wiremock = "0.6"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = { workspace = true }
futures-util = "0.3"
eventsource-stream = "0.2"
async-trait = { workspace = true }
uuid = { workspace = true }
