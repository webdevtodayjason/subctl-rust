[package]
name = "evy-watchdog"
description = "Evy v4 watchdog framework + Phase-4 watchdog impls (idle pane, team GC, prune)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace primitives.
evy-core = { workspace = true }
evy-providers = { workspace = true }
evy-scheduler = { workspace = true }
evy-comms = { workspace = true }
evy-memory = { workspace = true }

# Async runtime + cancellation token for graceful shutdown.
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }

# Trait objects with async fns.
async-trait = { workspace = true }

# Serialization + time + ids.
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
uuid = { workspace = true }

# Errors + logging.
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
# The Wave-4 suite in `tests/phase5_watchdogs.rs` subscribes to a LIVE
# `/api/evy/events` stream served by evy-comms's HttpServer to prove the
# cockpit frames reach the wire. Version pins mirror the choices already
# made in evy-comms / evy (same pattern as evy's cutover harness) so the
# dep graph stays tight.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
eventsource-stream = "0.2"
futures-util = "0.3"
