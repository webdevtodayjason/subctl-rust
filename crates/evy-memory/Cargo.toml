[package]
name = "evy-memory"
description = "Evy v4 observation log (sqlx + SQLite), retrieval, claude-mem consumer, learning-loop substrate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
evy-core = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
gray_matter = { version = "0.2", default-features = false, features = ["yaml"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
