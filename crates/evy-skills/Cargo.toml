[package]
name = "evy-skills"
description = "Evy v4 skill registry + router — worker-side procedural knowledge (markdown + frontmatter)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace primitives.
evy-core = { workspace = true }

# Async runtime — declared per spec; Phase 5 (semantic search via
# embeddings) will introduce async I/O. Unused in Phase 4.
tokio = { workspace = true }

# Trait objects with async fns — same Phase-5 forward-look as `tokio`.
async-trait = { workspace = true }

# Serialization. `gray_matter` (yaml engine) splits the YAML header
# from the markdown body and deserializes the typed frontmatter shape
# in one pass — no separate `serde_yaml` dep needed at the crate level.
serde = { workspace = true }
serde_json = { workspace = true }
gray_matter = { version = "0.2", default-features = false, features = ["yaml"] }

# Errors + logging.
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
