[package]
name = "evy-research"
description = "Evy v4 web-research substrate: search + page fetch via TinyFish."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Async + traits for the ResearchClient surface.
async-trait = { workspace = true }
tokio = { workspace = true }

# TinyFish wire transport. `rustls-tls` keeps us off the OpenSSL footgun;
# `json` enables typed body (de)serialization. Version matches evy-comms.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Serialization + time.
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }

# URL parsing for SourceTier heuristics.
url = "2"

# Errors + logging.
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `test-util` re-asserted for tokio::time::pause/advance helpers if needed.
tokio = { workspace = true, features = ["full", "test-util"] }
# Mock the TinyFish HTTP endpoints at the `reqwest` boundary so tests
# never touch the real api.search / api.fetch hosts.
wiremock = "0.6"
