[package]
name = "evy-policy"
description = "Evy v4 policy gate (Trusted / Gated / Sealed)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
evy-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

# ISO 8601 timestamps in snapshot headers + audit log entries.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Compiled deny_always.regex patterns (cached after first use).
regex = "1"

# SHA-256 over the canonical policy doc → first 8 hex chars become
# `allowlist_sha` in the snapshot header.
sha2 = "0.10"

# Lowercase hex encoding for the sha output.
hex = "0.4"

[dev-dependencies]
tempfile = "3"
# Integration tests under `tests/` need these directly (not transitively via
# the lib's deps).
toml = { workspace = true }
serde = { workspace = true }
regex = "1"
